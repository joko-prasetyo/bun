name: codex-build-patched-bun

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tls-boringssl-rollback

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUN_VERSION: 1.3.9
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 21 all

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y \
            ccache \
            cargo \
            cmake \
            git \
            golang \
            libtool \
            lld-21 \
            ninja-build \
            pkg-config \
            rustc \
            ruby-full \
            llvm-21-tools \
            xz-utils \
            zip

      - name: Install JS Dependencies
        run: |
          bun --version
          bun install --frozen-lockfile

      - name: Build Bun (Release)
        env:
          CC: clang-21
          CXX: clang++-21
          AR: llvm-ar-21
          RANLIB: llvm-ranlib-21
          LD: ld.lld-21
          CXXFLAGS: -Wno-error=undefined-var-template
        run: |
          set -o pipefail
          clang-21 --version
          ld.lld-21 --version
          bun --version
          bun ./scripts/build.mjs -GNinja -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF -DCMAKE_CXX_FLAGS=-Wno-error=undefined-var-template -B build/release 2>&1 | tee /tmp/build.log
          build_status=${PIPESTATUS[0]}
          {
            echo "### Build status: ${build_status}"
            echo '```'
            tail -n 200 /tmp/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ ${build_status} -eq 0 ]]
          ./build/release/bun --version

      - name: Verify Tokopedia TLS Behavior
        if: success()
        run: |
          cat >/tmp/test-tls.js <<'EOF'
          async function test() {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            const started = Date.now();
            try {
              const res = await fetch('https://gql.tokopedia.com', {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-tkpd-akamai': 'x',
                  'origin': 'https://m.tokopedia.com',
                  'user-agent': 'Mozilla/5.0 Chrome/120.0.0.0',
                },
                body: JSON.stringify({ query: '{ shop(id:1) { name } }' }),
                signal: controller.signal,
              });
              console.log('OK', res.status, Date.now() - started + 'ms');
            } catch (e) {
              console.log('FAIL', e.name, Date.now() - started + 'ms', e.message || '');
            } finally {
              clearTimeout(timeout);
            }
          }
          test();
          EOF
          ./build/release/bun /tmp/test-tls.js | tee /tmp/tls-result.txt

      - name: Package Installer Bundle
        if: success()
        run: |
          set -euxo pipefail
          mkdir -p /tmp/bun-installer-linux-x64/bin
          cp build/release/bun /tmp/bun-installer-linux-x64/bin/bun
          ln -sf bun /tmp/bun-installer-linux-x64/bin/bunx

          cat >/tmp/bun-installer-linux-x64/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
          BIN_DIR="$BUN_INSTALL/bin"

          mkdir -p "$BIN_DIR"
          install -m 755 "$SCRIPT_DIR/bin/bun" "$BIN_DIR/bun"
          ln -sf "$BIN_DIR/bun" "$BIN_DIR/bunx"

          echo "Installed Bun to $BIN_DIR"
          echo "Add this to your shell profile:"
          echo "export BUN_INSTALL=\"\$HOME/.bun\""
          echo "export PATH=\"\$BUN_INSTALL/bin:\$PATH\""
          EOF
          chmod +x /tmp/bun-installer-linux-x64/install.sh

          (
            cd /tmp
            tar -czf bun-linux-x64-installer.tar.gz bun-installer-linux-x64
            zip -rq bun-linux-x64-installer.zip bun-installer-linux-x64
          )

      - name: Download Official Installers (Linux/macOS/Windows)
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p /tmp/official-installers
          BASE_URL="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}"
          for ASSET in \
            bun-linux-x64.zip \
            bun-linux-aarch64.zip \
            bun-darwin-x64.zip \
            bun-darwin-aarch64.zip \
            bun-windows-x64.zip
          do
            curl -fL "${BASE_URL}/${ASSET}" -o "/tmp/official-installers/${ASSET}"
          done

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-release-and-tls-log
          if-no-files-found: warn
          path: |
            build/release/bun
            /tmp/build.log
            /tmp/tls-result.txt
            /tmp/bun-linux-x64-installer.tar.gz
            /tmp/bun-linux-x64-installer.zip
            /tmp/official-installers/bun-linux-x64.zip
            /tmp/official-installers/bun-linux-aarch64.zip
            /tmp/official-installers/bun-darwin-x64.zip
            /tmp/official-installers/bun-darwin-aarch64.zip
            /tmp/official-installers/bun-windows-x64.zip
